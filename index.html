<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="年表">
<meta name="theme-color" content="#f2f2f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
<meta name="description" content="歴史上の出来事の関係を、カテゴリ別レーンと引き出し線でたどる縦型年表">
<title>年表</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="vendor/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/industry.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hdr-row1">
      <button class="hdr-title" data-act="settings" aria-label="設定を開く">
        <span class="hdr-name">年表<svg class="hdr-gear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></span>
        <span class="hdr-sub" id="count">科学技術史</span>
      </button>
      <button class="btn btn-secondary hdr-links" id="links" data-act="links" aria-pressed="true">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><path d="M5 17A12 12 0 0 1 17 5"/></svg>
        関係線
      </button>
      <button class="btn btn-primary blueprint hdr-add" data-act="add">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        追加
      </button>
    </div>
    <div class="hdr-row2">
      <div class="chips" id="chips" role="group" aria-label="カテゴリの表示"></div>
      <button class="chip-edit" data-act="cats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>
        編集
      </button>
    </div>
    <div class="hdr-lanes" id="lanes" aria-hidden="true"></div>
  </header>

  <div id="stage">
    <div id="scroller">
      <div id="canvas">
        <div id="bands" aria-hidden="true"></div>
        <div id="guides" aria-hidden="true"></div>
        <div class="axis" aria-hidden="true"></div>
        <div id="ticks" aria-hidden="true"></div>
        <svg id="leaders" aria-hidden="true"></svg>
        <div id="cards"></div>
        <svg id="rels" aria-hidden="true"></svg>
      </div>
    </div>
    <div class="badges up" id="above"></div>
    <div class="badges down" id="below"></div>
    <div class="banner blueprint" id="banner" hidden></div>
    <p class="tab-warning" id="tab-warning" role="note" hidden>Safariで開いています。ここで入れた内容はホーム画面のアプリとは別に保存され、しばらく開かないと消えることがあります。共有ボタンから「ホーム画面に追加」して、そちらから開いてください。<button data-act="hide-warning">閉じる</button></p>
    <div class="zoom" id="zoom">
      <button class="btn btn-ghost" data-act="zoom-in" aria-label="拡大"><svg class="ic18" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <div class="zoom-label" id="zoom-label">表示幅<br><span>—</span></div>
      <button class="btn btn-ghost" data-act="zoom-out" aria-label="縮小"><svg class="ic18" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </div>
    <div class="toast blueprint" id="toast" hidden></div>
  </div>

  <div id="backdrop" data-act="close"></div>
  <section id="sheet" class="blueprint" aria-modal="true" role="dialog" aria-hidden="true">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <button class="btn btn-ghost sheet-close" data-act="close" aria-label="閉じる"><svg class="ic18" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <div id="sheet-body"></div>
  </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
